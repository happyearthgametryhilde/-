<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img">
  <title>Orange and red gradient 03</title>
  <defs>
    <linearGradient id="base" x1="25%" y1="0%" x2="75%" y2="100%"><stop stop-color="#d44235"/><stop offset="1" stop-color="#7f1e29"/></linearGradient>
    <radialGradient id="glow" cx="35%" cy="10%" r="85%"><stop stop-color="#ee8d5a" stop-opacity=".68"/><stop offset="1" stop-color="#ee8d5a" stop-opacity="0"/></radialGradient>
    <radialGradient id="shade" cx="80%" cy="95%" r="76%"><stop stop-color="#b33630" stop-opacity=".5"/><stop offset="1" stop-color="#b33630" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#base)"/>
  <rect width="1200" height="1500" fill="url(#glow)"/>
  <rect width="1200" height="1500" fill="url(#shade)"/>
</svg>
