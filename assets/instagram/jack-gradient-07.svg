<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img">
  <title>Orange and red gradient 07</title>
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#e7833d"/><stop offset="1" stop-color="#a64024"/></linearGradient>
    <radialGradient id="glow" cx="85%" cy="12%" r="85%"><stop stop-color="#f5b279" stop-opacity=".68"/><stop offset="1" stop-color="#f5b279" stop-opacity="0"/></radialGradient>
    <radialGradient id="shade" cx="80%" cy="95%" r="76%"><stop stop-color="#c86232" stop-opacity=".5"/><stop offset="1" stop-color="#c86232" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#base)"/>
  <rect width="1200" height="1500" fill="url(#glow)"/>
  <rect width="1200" height="1500" fill="url(#shade)"/>
</svg>
