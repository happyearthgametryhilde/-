<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img">
  <title>짙은 회색 그라데이션 공동 게시물</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4b4d52"/>
      <stop offset=".55" stop-color="#303237"/>
      <stop offset="1" stop-color="#1f2024"/>
    </linearGradient>
    <radialGradient id="soft-light" cx="22%" cy="12%" r="85%">
      <stop stop-color="#74777d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#74777d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#base)"/>
  <rect width="1200" height="1500" fill="url(#soft-light)"/>
</svg>
